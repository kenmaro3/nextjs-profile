    <g stroke="#e0b973" stroke-width="5" stroke-opacity=".45"><path d="M170 80V168M245 80L262 168M170 381L169 302M264 381L262 302"/></g>
    <g fill="#d6b976" stroke="#fae9c2" stroke-width="1.5">
