      <circle cx="76" cy="168" r="7"/><circle cx="107" cy="168" r="7"/><circle cx="138" cy="168" r="7"/><circle cx="169" cy="168" r="7"/><circle cx="200" cy="168" r="7"/><circle cx="231" cy="168" r="7"/><circle cx="262" cy="168" r="7"/>
      <circle cx="76" cy="302" r="7"/><circle cx="107" cy="302" r="7"/><circle cx="138" cy="302" r="7"/><circle cx="169" cy="302" r="7"/><circle cx="200" cy="302" r="7"/><circle cx="231" cy="302" r="7"/><circle cx="262" cy="302" r="7"/>
    </g>
