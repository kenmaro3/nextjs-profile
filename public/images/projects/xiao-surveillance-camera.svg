<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <title>XIAO監視カメラ試作の構成イメージ</title>
  <desc>34×44mmのキャリア基板とレンズ付きカメラを示す設計イラスト。実機写真ではありません。</desc>
  <defs>
    <linearGradient id="bg" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#101f32"/><stop offset="1" stop-color="#1f4654"/></linearGradient>
    <linearGradient id="board" x1="665" y1="100" x2="1005" y2="543" gradientUnits="userSpaceOnUse"><stop stop-color="#276b55"/><stop offset="1" stop-color="#174b3a"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#e0f3e8" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="58" width="245" height="32" rx="16" fill="#b2e4cc"/>
    <text x="82" y="80" fill="#153c2e" font-size="14" font-weight="700" letter-spacing="1.4">PCB ORDERED · OCT 2026</text>
    <text x="64" y="180" fill="#f1f7f7" font-size="56" font-weight="700">XIAO CAMERA</text>
    <text x="68" y="230" fill="#adc6ce" font-size="23">ESP32-S3 + OV5640 + PIR</text>
    <path d="M68 269H505" stroke="#476875"/>
    <text x="68" y="334" fill="#f1f7f7" font-size="37" font-weight="700">34 × 44 mm</text>
    <text x="68" y="365" fill="#adc6ce" font-size="16">2 LAYERS / USB POWER / DAYLIGHT</text>
    <g fill="#c8d8dc" font-size="17"><text x="68" y="432">Circuit &amp; PCB layout</text><text x="68" y="465">JPEG capture &amp; microSD storage</text><text x="68" y="498">PETG open bench mount</text></g>
    <text x="68" y="580" fill="#90abb4" font-size="14">DESIGN ILLUSTRATION · HARDWARE VALIDATION PENDING</text>
  </g>
  <g transform="translate(665 83)">
