    <g fill="#d9eee4" font-family="Arial,sans-serif" font-size="13"><text x="151" y="57">PWM</text><text x="233" y="57">PIR</text><text x="145" y="417">3V3</text><text x="252" y="417">GND</text><text x="28" y="442">USB ONLY / DAYLIGHT BENCH</text></g>
    <rect x="60" y="182" width="219" height="103" rx="10" fill="#cee0dc" stroke="#eff5f3" stroke-width="2"/>
    <rect x="78" y="198" width="73" height="70" rx="5" fill="#364f5a"/>
